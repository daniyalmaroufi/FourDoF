# Rotational Controller: ITR (Inner Tube Rotation) and OTR (Outer Tube Rotation)
# Each joint is an XL330-M288 motor driving its tube through a 1:40 worm gear
# (40 motor revolutions = 1 tube revolution). Tube rotation is continuous, so
# no min/max range is configured here.

device_name: "/dev/ttyUSB2"
baud_rate: 57600
protocol: 2.0

joints:
  ITR:
    motor_id: 1
    gear_ratio: 40
    default_speed_deg_s: 30.0     # tube deg/s; independent per joint, overridable at runtime via `speed`

  OTR:
    motor_id: 0
    gear_ratio: -40
    default_speed_deg_s: 30.0
